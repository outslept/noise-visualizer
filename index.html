<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>noise visualizer - worley / perlin / simplex</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <header class="hud" id="controls">
        <div class="modes" role="tablist" aria-label="Noise algorithm">
          <button
            class="mode-btn"
            role="tab"
            data-mode="worley"
            aria-selected="true"
          >
            worley
            <span class="tooltip" role="tooltip">Worley cellular <kbd>1</kbd></span>
          </button>
          <button
            class="mode-btn"
            role="tab"
            data-mode="perlin"
            aria-selected="false"
          >
            perlin
            <span class="tooltip" role="tooltip">Perlin gradient <kbd>2</kbd></span>
          </button>
          <button
            class="mode-btn"
            role="tab"
            data-mode="simplex"
            aria-selected="false"
          >
            simplex
            <span class="tooltip" role="tooltip">Simplex lattice <kbd>3</kbd></span>
          </button>
        </div>

        <div class="divider"></div>

        <div class="sliders">
          <label class="control">
            <abbr id="lbl-scale" title="Feature scale & radius">r</abbr>
            <input id="scale" type="range" min="28" max="96" value="56" />
            <strong id="val-scl">56</strong>
          </label>
          <label class="control">
            <abbr title="Steps per frame">spd</abbr>
            <input id="speed" type="range" min="1" max="8" value="2" />
            <strong id="val-spd">2</strong>
          </label>
        </div>

        <div class="divider"></div>

        <div class="metrics" id="stats" aria-live="polite">
          <span>
            <abbr id="lbl-count" title="Active nodes / capacity">cls</abbr>
            <strong id="val-count">0 / 0</strong>
          </span>
          <span>
            <abbr id="lbl-metric" title="Primary spatial metric">dst</abbr>
            <strong id="val-metric">0px</strong>
          </span>
        </div>

        <div class="divider"></div>

        <div class="actions" id="actions">
          <button
            class="icon-btn"
            id="toggle-play"
            aria-label="Pause simulation"
            data-state="playing"
          >
            <svg class="icon icon-pause" viewBox="0 0 16 16" fill="none">
              <rect x="4" y="3" width="2.5" height="10" rx="1" fill="currentColor" />
              <rect x="9.5" y="3" width="2.5" height="10" rx="1" fill="currentColor" />
            </svg>
            <svg class="icon icon-play" viewBox="0 0 16 16" fill="none">
              <path
                d="M4.5 3.2C4.5 2.65 5.1 2.32 5.56 2.62L12.7 7.42C13.1 7.7 13.1 8.3 12.7 8.58L5.56 13.38C5.1 13.68 4.5 13.35 4.5 12.8V3.2Z"
                fill="currentColor"
              />
            </svg>
            <span class="tooltip" role="tooltip">Pause <kbd>Space</kbd></span>
          </button>

          <button class="icon-btn" id="seed" aria-label="Add node">
            <svg class="icon icon-default" viewBox="0 0 16 16" fill="none">
              <path
                d="M8 3.5V12.5M3.5 8H12.5"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
            <svg class="icon icon-done" viewBox="0 0 16 16" fill="none">
              <path
                d="M3.5 8.5L6.5 11.5L12.5 4.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="tooltip" id="seed-tooltip" role="tooltip">Add cell <kbd>S</kbd></span>
          </button>

          <button class="icon-btn" id="restart" aria-label="Restart">
            <svg class="icon icon-default" viewBox="0 0 16 16" fill="none">
              <path
                d="M12.5 8A4.5 4.5 0 1 1 11.1 4.7M12.5 2.8V5.3H10"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="icon icon-done" viewBox="0 0 16 16" fill="none">
              <path
                d="M3.5 8.5L6.5 11.5L12.5 4.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="tooltip" role="tooltip">Restart <kbd>R</kbd></span>
          </button>
        </div>
      </header>

      <div class="canvas-frame">
        <canvas id="canvas" width="800" height="600"></canvas>
      </div>
    </main>

    <script src="index.js"></script>
    <script src="worley.js"></script>
    <script src="perlin.js"></script>
    <script src="simplex.js"></script>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const scaleInput = document.getElementById("scale");
      const speedInput = document.getElementById("speed");
      const lblScale = document.getElementById("lbl-scale");
      const lblCount = document.getElementById("lbl-count");
      const lblMetric = document.getElementById("lbl-metric");
      const valScl = document.getElementById("val-scl");
      const valSpd = document.getElementById("val-spd");
      const valCount = document.getElementById("val-count");
      const valMetric = document.getElementById("val-metric");
      const togglePlayBtn = document.getElementById("toggle-play");
      const toggleTooltip = togglePlayBtn.querySelector(".tooltip");
      const seedBtn = document.getElementById("seed");
      const seedTooltip = document.getElementById("seed-tooltip");
      const restartBtn = document.getElementById("restart");
      const modeBtns = document.querySelectorAll(".mode-btn");

      let currentMode = "worley";
      let state;
      let raf;
      let isPlaying = true;
      let steps = parseInt(speedInput.value, 10);

      function syncHudLabels() {
        if (currentMode === "worley") {
          lblScale.textContent = "r";
          lblScale.title = "Cell radius & falloff scale";
          lblCount.textContent = "cls";
          lblCount.title = "Active cells / capacity";
          lblMetric.textContent = "dst";
          lblMetric.title = "Mean nearest-neighbor distance";
          seedTooltip.innerHTML = `Add cell <kbd>S</kbd>`;
        } else {
          lblScale.textContent = "scl";
          lblScale.title = "Noise wavelength scale";
          lblCount.textContent = "nds";
          lblCount.title = "Warp vortices / capacity";
          lblMetric.textContent = "len";
          lblMetric.title = "Total primary isoline length";
          seedTooltip.innerHTML = `Add vortex <kbd>S</kbd>`;
        }
      }

      function updateStats() {
        valCount.textContent = `${state.count} / ${state.maxCount}`;
        valMetric.textContent = `${Math.round(state.metricValue)}px`;
      }

      function render() {
        if (isPlaying) {
          for (let i = 0; i < steps; i++) {
            stepNoise(state);
          }
        }

        renderNoise(ctx, state);
        updateStats();

        raf = isPlaying ? requestAnimationFrame(render) : null;
      }

      function reset() {
        if (raf) cancelAnimationFrame(raf);
        const scl = parseInt(scaleInput.value, 10);
        valScl.textContent = scl;
        syncHudLabels();
        state = createNoiseState(canvas.width, canvas.height, currentMode, scl);
        render();
      }

      function setMode(mode) {
        if (mode === currentMode && state) return;
        currentMode = mode;
        modeBtns.forEach((btn) => {
          btn.setAttribute("aria-selected", btn.dataset.mode === mode ? "true" : "false");
        });
        reset();
      }

      function togglePlay(viaKeyboard = false) {
        isPlaying = !isPlaying;
        if (viaKeyboard) {
          togglePlayBtn.dataset.instant = "true";
          requestAnimationFrame(() => delete togglePlayBtn.dataset.instant);
        }
        togglePlayBtn.dataset.state = isPlaying ? "playing" : "paused";
        togglePlayBtn.setAttribute(
          "aria-label",
          isPlaying ? "Pause simulation" : "Resume simulation",
        );
        toggleTooltip.innerHTML = `${isPlaying ? "Pause" : "Play"} <kbd>Space</kbd>`;
        if (isPlaying && !raf) render();
      }

      function flashConfirmState(btn) {
        clearTimeout(btn._confirmTimer);
        btn.dataset.confirmed = "true";
        btn._confirmTimer = setTimeout(() => delete btn.dataset.confirmed, 650);
      }

      function spawnRandomNode() {
        const margin = 68;
        const x = margin + Math.random() * (canvas.width - margin * 2);
        const y = margin + Math.random() * (canvas.height - margin * 2);
        addInteractiveNode(state, x, y);
        flashConfirmState(seedBtn);
        if (!raf && isPlaying) render();
        else if (!isPlaying) {
          refreshStaticState(state);
          renderNoise(ctx, state);
          updateStats();
        }
      }

      modeBtns.forEach((btn) => {
        btn.addEventListener("click", () => setMode(btn.dataset.mode));
      });

      scaleInput.addEventListener("input", () => {
        const scl = parseInt(scaleInput.value, 10);
        valScl.textContent = scl;
        updateNoiseScale(state, scl);
        if (!raf && isPlaying) render();
        else if (!isPlaying) {
          renderNoise(ctx, state);
          updateStats();
        }
      });

      speedInput.addEventListener("input", () => {
        steps = parseInt(speedInput.value, 10);
        valSpd.textContent = speedInput.value;
      });

      togglePlayBtn.addEventListener("click", () => togglePlay(false));
      seedBtn.addEventListener("click", spawnRandomNode);
      restartBtn.addEventListener("click", () => {
        reset();
        flashConfirmState(restartBtn);
      });

      canvas.addEventListener("pointerdown", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * canvas.width;
        const y = ((e.clientY - rect.top) / rect.height) * canvas.height;
        addInteractiveNode(state, x, y);
        if (!raf && isPlaying) render();
        else if (!isPlaying) {
          refreshStaticState(state);
          renderNoise(ctx, state);
          updateStats();
        }
      });

      canvas.addEventListener("pointermove", (e) => {
        const rect = canvas.getBoundingClientRect();
        state.pointerX = ((e.clientX - rect.left) / rect.width) * canvas.width;
        state.pointerY = ((e.clientY - rect.top) / rect.height) * canvas.height;
        state.pointerActive = true;
      });

      canvas.addEventListener("pointerleave", () => {
        state.pointerActive = false;
      });

      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if (e.code === "Space") {
          e.preventDefault();
          togglePlay(true);
        } else if (e.key === "r" || e.key === "R") {
          reset();
          flashConfirmState(restartBtn);
        } else if (e.key === "s" || e.key === "S") {
          spawnRandomNode();
        } else if (e.key === "1") {
          setMode("worley");
        } else if (e.key === "2") {
          setMode("perlin");
        } else if (e.key === "3") {
          setMode("simplex");
        }
      });

      const hudContainer = document.getElementById("controls");
      let tooltipWarmTimer = null;

      hudContainer.addEventListener("pointerenter", () => clearTimeout(tooltipWarmTimer));
      hudContainer.querySelectorAll(".icon-btn, .mode-btn").forEach((btn) => {
        btn.addEventListener("pointerenter", () => {
          if (hudContainer.dataset.warm === "true") {
            btn.dataset.instant = "true";
          } else {
            btn._warmTimeout = setTimeout(() => {
              hudContainer.dataset.warm = "true";
            }, 320);
          }
        });
        btn.addEventListener("pointerleave", () => {
          clearTimeout(btn._warmTimeout);
          delete btn.dataset.instant;
        });
      });
      hudContainer.addEventListener("pointerleave", () => {
        tooltipWarmTimer = setTimeout(() => delete hudContainer.dataset.warm, 350);
      });

      reset();
    </script>
  </body>
</html>
